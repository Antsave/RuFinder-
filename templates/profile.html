{% extends "base.html" %}

{% block content %}
<div class="login-container">
  <h2 class="login-title">Who <span class="highlight">R U?</span></h2>

  <div class="profile-info" style="text-align: left; margin-top: 2rem;">
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Display Name:</strong> {{ user.display_name }}</p>

    <form action="{% url 'logout' %}" method="post" style="margin-top: 2rem;">
        {% csrf_token %}
        <button type="submit" style="width:100%; background-color: #555;">Log Out</button>
    </form>
  </div>
</div>
{% endblock %}
