{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RU Finder</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <header>
        <button id="menu-button" class="menu-button">
            &#9776; <!-- Hamburger Icon -->
        </button>

        <div class="logo-container">
             <a href="{% url 'home' %}">
                 <!-- Make sure your logo image is in static/images/ -->
                 <img src="{% static 'images/main logo.png' %}" alt="RU Finder Logo" class="header-logo">
             </a>
        </div>

        <nav id="nav-menu" class="nav-menu">
            <a href="{% url 'home' %}">Home</a>
            <a href="#">Lost Items</a>
            <a href="#">Found Items</a>
            <a href="#">Post</a>
            <a href="{% url 'profile' %}">Profile</a>
            <button id="close-menu-button" class="close-button">&times;</button>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- Child template content will be inserted here -->
        {% endblock %}
    </main>

    <footer>
        <p>© 2025 RU Finder. All rights reserved.</p>
    </footer>

    <!-- JAVASCRIPT FOR THE MENU -->
    <script>
        const menuButton = document.getElementById('menu-button');
        const closeMenuButton = document.getElementById('close-menu-button');
        const navMenu = document.getElementById('nav-menu');

        if (menuButton && navMenu && closeMenuButton) {
            menuButton.addEventListener('click', () => {
                navMenu.classList.add('active');
            });

            closeMenuButton.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        }
    </script>

</body>
</html>
